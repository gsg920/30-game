
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>30초 생존: 네모 탈출</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#f8fafc;padding:20px}
main{max-width:560px;margin:auto}
h1{font-size:clamp(24px,5vw,34px);margin:8px 0}
p{line-height:1.6;color:#cbd5e1}
.panel{background:#172033;border:1px solid #334155;border-radius:14px;padding:14px;margin:12px 0}
.stats{display:flex;justify-content:space-between;gap:10px;font-weight:700}
canvas{display:block;width:100%;height:auto;background:#101827;border:2px solid #475569;border-radius:10px;touch-action:none}
button{background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #facc15;outline-offset:3px}
button.secondary{background:#334155}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:12px auto}
.controls button{font-size:22px;padding:12px}
.controls button[data-dir="up"]{grid-column:2}
.controls button[data-dir="left"]{grid-column:1;grid-row:2}
.controls button[data-dir="down"]{grid-column:2;grid-row:2}
.controls button[data-dir="right"]{grid-column:3;grid-row:2}
.actions{display:flex;gap:10px;flex-wrap:wrap}
label{display:inline-flex;align-items:center;gap:8px;margin:8px 12px 8px 0}
.small{font-size:14px}
#message{font-weight:700;min-height:1.5em}
</style>
</head>
<body>
<main>
  <h1>30초 생존: 네모 탈출</h1>
  <p>파란 네모를 움직여 빨간 장애물을 피하세요. 30초를 버티면 승리합니다.</p>

  <section class="panel" aria-label="게임 상태">
    <div class="stats">
      <span>남은 시간: <span id="time">30.0</span>초</span>
      <span>생존 점수: <span id="score">0</span></span>
    </div>
    <p id="message" role="status" aria-live="polite">시작 버튼을 눌러 게임을 시작하세요.</p>
    <canvas id="game" width="480" height="360"
      aria-label="게임 영역. 방향키 또는 WASD로 파란 플레이어를 이동하세요."></canvas>
  </section>

  <section class="panel">
    <strong>조작 방법</strong>
    <p class="small">키보드: 방향키 또는 WASD · 모바일: 아래 방향 버튼</p>
    <div class="controls" aria-label="모바일 조작">
      <button data-dir="up" aria-label="위로 이동">↑</button>
      <button data-dir="left" aria-label="왼쪽으로 이동">←</button>
      <button data-dir="down" aria-label="아래로 이동">↓</button>
      <button data-dir="right" aria-label="오른쪽으로 이동">→</button>
    </div>
    <div class="actions">
      <button id="start">시작 / 다시 시작</button>
      <button id="pause" class="secondary">일시정지</button>
    </div>
    <div>
      <label><input id="sound" type="checkbox"> 효과음 켜기</label>
      <label><input id="reduced" type="checkbox"> 깜빡임 줄이기</label>
    </div>
    <p class="small">기록은 이 브라우저에만 저장됩니다. 다른 기기와 공유되지 않습니다.</p>
    <p class="small">최고 생존 시간: <span id="best">0.0</span>초</p>
    <button id="resetData" class="secondary">기록 초기화</button>
  </section>
</main>

<script>
(() => {
  "use strict";
  const canvas = document.querySelector("#game");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const W = canvas.width, H = canvas.height;
  const DURATION = 30, SIZE = 16, SPEED = 190;

  let player, obstacles, elapsed, state, lastTime, spawnClock;
  let keys = new Set(), animationId = 0, soundContext = null;
  let soundOn = false, reducedMotion = false;

  function readSettings() {
    try {
      const raw = localStorage.getItem("dodge30-settings");
      const value = raw ? JSON.parse(raw) : {};
      return {
        best: Number.isFinite(value.best) && value.best >= 0
          ? Math.min(value.best, DURATION) : 0,
        sound: value.sound === true,
        reduced: value.reduced === true
      };
    } catch (_) {
      return {best:0, sound:false, reduced:false};
    }
  }

  let settings = readSettings();

  function saveSettings() {
    try {
      localStorage.setItem("dodge30-settings", JSON.stringify({
        best: settings.best, sound: soundOn, reduced: reducedMotion
      }));
    } catch (_) {
      // 저장을 사용할 수 없어도 게임은 계속 실행됩니다.
    }
  }

  function loadSettingsUI() {
    $("best").textContent = settings.best.toFixed(1);
    $("sound").checked = soundOn = settings.sound;
    $("reduced").checked = reducedMotion = settings.reduced;
  }

  function resetRound() {
    player = {x: W/2-SIZE/2, y: H-55, size: SIZE};
    obstacles = [];
    elapsed = 0;
    spawnClock = 0;
    keys.clear();
    $("time").textContent = DURATION.toFixed(1);
    $("score").textContent = "0";
  }

  function setMessage(text) {
    $("message").textContent = text;
  }

  function startGame() {
    cancelAnimationFrame(animationId);
    resetRound();
    state = "playing";
    lastTime = performance.now();
    $("pause").textContent = "일시정지";
    setMessage("게임 진행 중! 장애물을 피하세요.");
    animationId = requestAnimationFrame(loop);
  }

  function endGame(won) {
    state = won ? "won" : "lost";
    keys.clear();
    if (elapsed > settings.best) {
      settings.best = elapsed;
      saveSettings();
      $("best").textContent = settings.best.toFixed(1);
    }
    setMessage(won
      ? "성공! 30초 생존했습니다. 다시 시작할 수 있습니다."
      : "실패! 장애물에 충돌했습니다. 다시 도전하세요.");
    beep(won ? 660 : 180);
    draw();
  }

  function beep(frequency) {
    if (!soundOn) return;
    try {
      soundContext ??= new (window.AudioContext || window.webkitAudioContext)();
      if (soundContext.state === "suspended") soundContext.resume();
      const osc = soundContext.createOscillator();
      const gain = soundContext.createGain();
      osc.frequency.value = frequency;
      gain.gain.value = 0.035;
      osc.connect(gain);
      gain.connect(soundContext.destination);
      osc.start();
      osc.stop(soundContext.currentTime + 0.12);
    } catch (_) {}
  }

  function spawnObstacle() {
    const size = 13 + Math.random() * 15;
    obstacles.push({
      x: Math.random() * (W-size),
      y: -size,
      size,
      speed: 305 + Math.random()*95 + elapsed*5
    });
  }

  function overlaps(a,b) {
    return a.x < b.x+b.size && a.x+a.size > b.x &&
           a.y < b.y+b.size && a.y+a.size > b.y;
  }

  function update(dt) {
    if (state !== "playing") return;

    elapsed = Math.min(DURATION, elapsed+dt);
    const dx = Number(keys.has("right")) - Number(keys.has("left"));
    const dy = Number(keys.has("down")) - Number(keys.has("up"));
    const length = Math.hypot(dx,dy) || 1;
    player.x += dx/length*SPEED*dt;
    player.y += dy/length*SPEED*dt;

    player.x = Math.max(0, Math.min(W-SIZE, player.x));
    player.y = Math.max(0, Math.min(H-SIZE, player.y));

    spawnClock += dt;
    const spawnInterval = Math.max(0.22, 0.52-elapsed*0.012);
    while (spawnClock >= spawnInterval) {
      spawnClock -= spawnInterval;
      spawnObstacle();
    }

    for (const o of obstacles) o.y += o.speed*dt;
    obstacles = obstacles.filter(o => o.y < H+o.size);

    $("time").textContent = Math.max(0,DURATION-elapsed).toFixed(1);
    $("score").textContent = Math.floor(elapsed);

    if (obstacles.some(o => overlaps(player,o))) {
      endGame(false);
      return;
    }
    if (elapsed >= DURATION) endGame(true);
  }

  function draw() {
    ctx.fillStyle = "#101827";
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = reducedMotion ? "#1b2638" : "#253249";
    ctx.lineWidth = 1;
    for(let x=0;x<W;x+=24){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=0;y<H;y+=24){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }

    ctx.fillStyle = "#f87171";
    for(const o of obstacles) ctx.fillRect(o.x,o.y,o.size,o.size);

    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(player.x,player.y,player.size,player.size);

    if(state !== "playing"){
      ctx.fillStyle = "rgba(2,6,23,.76)";
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = "#f8fafc";
      ctx.textAlign = "center";
      ctx.font = "bold 25px system-ui";
      const title = state === "won" ? "SURVIVED!" :
                    state === "lost" ? "GAME OVER" : "READY?";
      ctx.fillText(title,W/2,H/2);
      ctx.font = "15px system-ui";
      ctx.fillText(
        state === "ready" ? "시작 버튼을 누르세요" : "시작 / 다시 시작 버튼으로 재도전",
        W/2,H/2+30
      );
    }
  }

  function loop(now) {
    if(state !== "playing") return;
    // 탭 전환 후 긴 프레임 지연이 한 번에 반영되지 않도록 제한
    const dt = Math.min((now-lastTime)/1000,0.05);
    lastTime = now;
    update(dt);
    draw();
    if(state === "playing") animationId = requestAnimationFrame(loop);
  }

  const keyMap = {
    arrowup:"up", w:"up",
    arrowdown:"down", s:"down",
    arrowleft:"left", a:"left",
    arrowright:"right", d:"right"
  };

  window.addEventListener("keydown", e => {
    const dir = keyMap[e.key.toLowerCase()];
    if(!dir) return;
    e.preventDefault();
    if(state === "playing") keys.add(dir);
  });

  window.addEventListener("keyup", e => {
    const dir = keyMap[e.key.toLowerCase()];
    if(dir) keys.delete(dir);
  });

  window.addEventListener("blur", () => keys.clear());

  document.querySelectorAll("[data-dir]").forEach(button => {
    const dir = button.dataset.dir;
    const release = e => {
      e.preventDefault();
      keys.delete(dir);
    };
    button.addEventListener("pointerdown", e => {
      e.preventDefault();
      if(state === "playing") keys.add(dir);
    });
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
    button.addEventListener("contextmenu", e => e.preventDefault());
  });

  $("start").addEventListener("click", startGame);

  $("pause").addEventListener("click", () => {
    if(state === "playing"){
      state = "paused";
      cancelAnimationFrame(animationId);
      keys.clear();
      setMessage("일시정지 중입니다. 버튼을 눌러 이어서 진행하세요.");
      $("pause").textContent = "계속하기";
      draw();
    } else if(state === "paused"){
      state = "playing";
      lastTime = performance.now();
      $("pause").textContent = "일시정지";
      setMessage("게임 진행 중! 장애물을 피하세요.");
      animationId = requestAnimationFrame(loop);
    }
  });

  $("sound").addEventListener("change", e => {
    soundOn = e.target.checked;
    saveSettings();
  });

  $("reduced").addEventListener("change", e => {
    reducedMotion = e.target.checked;
    saveSettings();
    draw();
  });

  $("resetData").addEventListener("click", () => {
    try { localStorage.removeItem("dodge30-settings"); } catch (_) {}
    settings = {best:0,sound:soundOn,reduced:reducedMotion};
    saveSettings();
    $("best").textContent = "0.0";
    setMessage("기록을 초기화했습니다.");
  });

  // 브라우저가 탭을 숨길 때 입력이 고착되지 않도록 처리
  document.addEventListener("visibilitychange", () => {
    if(document.hidden) keys.clear();
  });

  loadSettingsUI();
  resetRound();
  state = "ready";
  draw();
})();
</script>
</body>
</html>
